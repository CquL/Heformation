# One offshore observation job. The solver chooses the AIR observer and the
# qualified underwater method; USV support is selected only if delivery needs it.
# Coordinates are metres in the model scene, not a real-sea distance claim.
request_id: offshore-joint-observation
template_id: OFFSHORE_JOINT
service_time_s: 4.0
deadline_s: null
delivery_required: true
return_required: true
requirement:
  footprint_radius_m: 2.5
  min_dwell_s: 1.0
  cruise_altitude_m: 0.8
  max_distance_from_altitude_m: 3.0
regions:
  - region_id: offshore_air
    kind: SURFACE
    corner_a: [0.0, 2.0, 0.0]
    corner_b: [6.0, 6.0, 0.0]
    interest_points:
      # Four footprint witnesses in a bounded two-lane sweep. The points are
      # visited in order; all four observations are required before return.
      - {point_id: air_swath_1, position: [1.0, 3.0, 0.0], weight: 1.0}
      - {point_id: air_swath_2, position: [5.0, 3.0, 0.0], weight: 1.0}
      - {point_id: air_swath_3, position: [5.0, 5.0, 0.0], weight: 1.0}
      - {point_id: air_swath_4, position: [1.0, 5.0, 0.0], weight: 1.0}
  - region_id: offshore_aav_water
    kind: UNDERWATER
    corner_a: [-4.0, 0.0, -0.6]
    corner_b: [-2.0, 2.0, -0.6]
    interest_points:
      - {point_id: aav_water_sample, position: [-3.0, 1.0, -0.6], weight: 1.0}
  - region_id: offshore_uuv
    kind: UNDERWATER
    corner_a: [-4.0, 3.0, -2.0]
    corner_b: [1.0, 5.0, -2.0]
    interest_points:
      - {point_id: deep_swath_1, position: [-3.0, 4.0, -2.0], weight: 1.0}
      - {point_id: deep_swath_2, position: [-1.5, 4.0, -2.0], weight: 1.0}
      - {point_id: deep_swath_3, position: [0.0, 4.0, -2.0], weight: 1.0}
