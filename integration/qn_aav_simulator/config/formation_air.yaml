formation_action_server:
  agent_ids: [0, 1, 2, 3, 4, 5, 6]
  swarm_scale: 2.0
  relative_slots:
    "0": [0.0, 0.0, 0.0]
    "1": [1.7321, -1.0, 0.0]
    "2": [0.0, -2.0, 0.0]
    "3": [-1.7321, -1.0, 0.0]
    "4": [-1.7321, 1.0, 0.0]
    "5": [0.0, 2.0, 0.0]
    "6": [1.7321, 1.0, 0.0]
  epsilon_p: 0.5
  epsilon_v: 0.25
  odom_timeout: 0.25
  execution_timeout: 180.0
  monitor_rate: 20.0
  startup_timeout: 180.0
  # CPU build of the upstream renderer publishes a point cloud, not a depth image.
  sensor_backend: CPU_POINTCLOUD
  # The upstream map_generator only creates obstacles inside x in [-17, 17],
  # y in [-7.5, 7.5]; this test corridor is x in [-30, -22].  The CPU renderer
  # publishes pcl_render_node/cloud only when points are inside the sensing
  # horizon, so the operating region is declared known-empty explicitly instead
  # of treating a silent sensor as a trusted empty measurement.
  known_empty_map: true
  cloud_timeout: 3.0
  qn_state_timeout: 1.0
  model_time_window: 0.06
  time_baseline_seconds: 30.0
  time_rate_lower: 0.95
  time_rate_upper: 1.05
  max_model_ros_drift: 0.05
  max_cross_agent_drift: 0.05
  time_reference_displacement_limit: 0.25
  inter_agent_clearance: 0.5
  obstacle_clearance: 0.2
  obstacle_sample_period: 1.0
  # Physical envelope of one AAV and the surface plane used for geometric
  # safety.  The AIR floor is not configured here: it is derived from the qn
  # model as hg_m / 2, so it cannot drift out of step with the plant.
  platform_radius_m: 0.25
  surface_plane_m: 0.0
  min_valid_sample_ratio: 0.9

formation_mission_runner:
  # M2 scenario marker: the offline verifier uses this to know whether the run
  # must show that the obstacle reached the planners.
  obstacle_scenario: false
  # Static routing: the online scenario has exactly one dispatchable execution
  # unit.  Units without an action_endpoint may take part in offline planning
  # but are never dispatched.
  executors:
    - executor_id: aav_formation
      physical_agent_ids: [drone_0, drone_1, drone_2, drone_3, drone_4, drone_5, drone_6]
      capabilities: [AIR, AAV]
      action_endpoint: /formation_action
      initial_target_ref: start
  seed: 0
  nominal_speed_mps: 1.5
  delay_tolerance: 0.1
  initial_target_ref: start
  # repair_mode: on -> planRepair updates the remaining Plan (Test C, repair-on)
  # repair_mode: off -> identical schedule, repair disabled (Test C, control)
  repair_mode: "on"
  centers:
    start: [-26.0, 0.0, 0.5]
    A: [-24.0, 0.0, 0.5]
    B: [-22.0, 0.0, 0.5]
    Return: [-26.0, 0.0, 0.5]
  # Input order deliberately differs from the v9 allocation order.
  tasks:
    - {task_id: T3, required_capabilities: [AAV], required_agent_count: 7, service_time: 5.0, deadline: 100.0, target_ref: Return}
    - {task_id: T1, required_capabilities: [AAV], required_agent_count: 7, service_time: 5.0, deadline: 7.0, target_ref: A}
    - {task_id: T2, required_capabilities: [AAV], required_agent_count: 7, service_time: 5.0, deadline: 13.0, target_ref: B}
