# Three-AAV online configuration (plan: coastal monitoring task line).
#
# The upstream normal_hexagon.yaml describes a seven-member hexagon at scale 2.
# This file is the same structure for the three AAVs the task line actually
# commands: a line abreast at 2 m spacing for the declared assembly/transfer demonstration,
# scale 1.0 so the offsets below are the real spacing.
#
# Slot layout and shape must agree with the action server's relative_slots for
# these members, which the server checks at readiness.
aav_1_action_server: &safety_action
  safety_hold_enabled: true
  cloud_timeout: &cloud_timeout 3.0
  odom_timeout: &odom_timeout 0.25
  safety_hold_timeout_s: 180.0
aav_2_action_server: *safety_action
aav_3_action_server: *safety_action
aav_formation_action_server: *safety_action

global_goal:
  swarm_central_pos: {x: -30.0, y: 6.0, z: 0.8}
  swarm_scale: 1.0
  relative_pos_0: {x: 0.0, y: 0.0, z: 0.0}
  relative_pos_1: {x: 0.0, y: -2.0, z: 0.0}
  relative_pos_2: {x: 0.0, y: 2.0, z: 0.0}
  # Members 3..6 do not exist in this configuration.  The FSM reads seven slots
  # with a -1.0 default; leaving them out is deliberate, not an oversight.
  relative_pos_3: {x: 0.0, y: 0.0, z: 0.0}
  relative_pos_4: {x: 0.0, y: 0.0, z: 0.0}
  relative_pos_5: {x: 0.0, y: 0.0, z: 0.0}
  relative_pos_6: {x: 0.0, y: 0.0, z: 0.0}

optimization:
  # DECLARED_FORMATION: the desired set is the three slots above, not the
  # upstream seven-node hexagon.  With type 1 the optimiser would build seven
  # expected nodes, the "wait for all members" guard would trip on three, and the
  # similarity cost would be skipped entirely.
  formation_type: 2
  formation_size: 3
  weight_obstacle: 50000.0
  weight_swarm: 50000.0
  weight_feasibility: 10000.0
  weight_sqrvariance: 10000.0
  weight_time: 80.0
  weight_formation: 15000.0
  obstacle_clearance: 0.5
  # Upstream activates pair avoidance below 1.5 * this value in metres.
  # Action safety requires centre distance >= 2 * 0.25 m radius + 0.50 m
  # surface clearance = 1.00 m.  The next representable decimal is used so
  # the optimizer is not less strict than the Action safety boundary.
  swarm_clearance: 0.6666666666666667

fsm:
  safety_hold_enabled: true
  safety_cloud_timeout: *cloud_timeout
  safety_odom_timeout: *odom_timeout
  replan_trajectory_time: 0.1
