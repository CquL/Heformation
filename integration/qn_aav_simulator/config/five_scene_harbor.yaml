# Explicit nearshore experiment, not surveyed terrain or vessel specifications.
# Same native models/tasks as five_scene.yaml; added physical static geometry.
# Mother-ship visual: vendored Stonefish aquadelmo, NED -> ENU at the marker.
scene:
  geometry_enabled: true
  topic: /scene/global_cloud
  frame_id: world
  surface_z_m: 0.0
  seabed_z_m: -6.0
  required_clearance_m: 0.2
  resolution: 0.2
  obstacle_present: true
  obstacle_center: [-18.0, 0.0, -1.0]
  obstacle_size: [2.0, 2.0, 4.0]
  objects:
    - {id: pier, kind: SOLID, center: [-18.0, 0.0, -1.0], size: [2.0, 2.0, 4.0], appearance: jetty}
    - {id: rock, kind: SOLID, center: [6.0, 1.0, -3.0], size: [2.0, 2.0, 2.0], appearance: rock}
    - {id: exclusion, kind: FORBIDDEN, center: [-12.0, 10.0, -2.0], size: [2.0, 2.0, 8.0]}
    - {id: quay, kind: SOLID, center: [-7.0, 15.5, -1.5], size: [52.0, 3.0, 9.0], appearance: quay}
    - {id: jetty_west, kind: SOLID, center: [-18.0, 10.0, -2.5], size: [2.0, 8.0, 7.0], appearance: jetty}
    - {id: jetty_east, kind: SOLID, center: [14.0, 10.0, -2.5], size: [2.0, 8.0, 7.0], appearance: jetty}
    - {id: reef_west, kind: SOLID, center: [-8.0, -3.0, -4.5], size: [3.0, 3.0, 3.0], appearance: rock}
    - {id: reef_east, kind: SOLID, center: [10.0, 2.0, -4.5], size: [3.0, 2.0, 3.0], appearance: rock}
    - {id: reef_outer, kind: SOLID, center: [19.0, 6.0, -4.5], size: [3.0, 3.0, 3.0], appearance: rock}
    # Encloses all original visual vertices after (x,y,z)->(x,-y,-z).
    - {id: mother_ship_hull, kind: SOLID, center: [14.403096, -8.0, 0.285414], size: [7.891588, 2.186304, 1.731388], appearance: mother_ship}
  mother_ship_position: [15.0, -8.0, 0.0]
  # Declared radio attachment above the rendered solid hull (top ~1.15m).
  # The hull centre is not a valid LOS receiver; this is geometry, not an
  # experimentally calibrated antenna specification.
  mother_ship_receiver_position: [15.0, -8.0, 2.0]
  # Operator-confirmed return policy: each participating platform comes back
  # to its declared deployment footprint. Marine radii are native hull proxies;
  # AAV uses the existing AIR Action terminal position tolerance (0.5 m),
  # so a successful return Goal can imply arrival in this business region.
  # These are not the unrelated Action entry tolerance. Every return ball is
  # inside the declared static free space. REMUS may pass through its return
  # ball after observation, then complete a verified safe terminal tail; AAV
  # and Otter must finish inside theirs. A declared ball alone proves no route.
  return_sites:
    drone_0: {position: [-30.0, 6.0, 0.8], radius_m: 0.5}
    drone_1: {position: [-30.0, 4.0, 0.8], radius_m: 0.5}
    drone_2: {position: [-30.0, 8.0, 0.8], radius_m: 0.5}
    usv: {position: [-10.0, 4.0, 0.0], radius_m: 1.1891593669479295}
    uuv: {position: [-5.0, 8.0, -2.0], radius_m: 0.8056208785775105}
  transition_sites:
    - {id: aav_entry, position: [-28.0, 6.0, 0.0]}
    # The sample-aligned entry was checked with the original Swarm/qn model;
    # static clearance alone does not qualify a conversion action.
    # The direct AIR leg crossed the west jetty's required clearance in an
    # actual Action. The first stage passed two native AIR Goals with the
    # existing four-second handover stabilization. A second south-side stage
    # keeps the next AIR leg clear of the idle USV at (-10,4); both stages are
    # finite scene candidates, not a new avoidance controller.
    - id: sample_entry
      position: [0.0, 8.0, 0.0]
      air_stages: [[-15.0, 3.0, 0.8], [-10.0, 0.0, 0.8]]
  communication_sites:
    - {id: sample_support_west, position: [4.0, 8.0, 0.0]}
    - {id: sample_support_east, position: [6.0, 8.0, 0.0]}
  observation_targets:
    - {id: air_overview, position: [-28.0, 4.0, 0.8], domain: AIR}
    - {id: underwater_sample, position: [0.0, 8.0, -2.0], domain: WATER}
  visual_assets: /experiments/assets
