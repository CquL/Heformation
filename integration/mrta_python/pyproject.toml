[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calvo-v9-restricted-python"
version = "0.2.0"
description = "Restricted-domain Python port of Calvo MRTA heuristic and repair logic"
requires-python = ">=3.8"
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools]
packages = ["mrta_python"]
include-package-data = false

[tool.setuptools.package-dir]
mrta_python = "."

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
