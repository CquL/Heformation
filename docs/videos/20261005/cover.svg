<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Heformation 空—海—潜协同任务控制</title>
  <desc id="description">三台同型AAV、一台USV和一台UUV共用任务输入、联合方案、协同执行与结果接收链路。此图为项目封面，不是实验轨迹。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#07172e"/>
      <stop offset="1" stop-color="#10394a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ad9e5" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#background)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <path d="M38 55c12-12 22-12 34 0s22 12 34 0M38 75c12-12 22-12 34 0s22 12 34 0" fill="none" stroke="#21d1ce" stroke-width="7" stroke-linecap="round"/>
  <g fill="#fff" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <text x="127" y="77" font-size="51" font-weight="700">Heformation</text>
    <text x="43" y="125" font-size="23" fill="#aee2ee">空—海—潜异构航行器协同任务控制</text>
    <text x="43" y="163" font-size="17" fill="#8eaabd">3 × AAV · 1 × USV · 1 × UUV</text>
    <text x="1160" y="64" text-anchor="end" font-size="17" fill="#8eaabd">Swarm · qn · Otter/PVS</text>
    <text x="1160" y="95" text-anchor="end" font-size="17" fill="#8eaabd">Qt 任务控制台 + 独立 RViz</text>
    <rect x="42" y="192" width="344" height="67" rx="12" fill="#123d50" stroke="#33c6df" stroke-opacity=".6"/>
    <rect x="428" y="192" width="344" height="67" rx="12" fill="#1b3648" stroke="#a6d466" stroke-opacity=".6"/>
    <rect x="814" y="192" width="344" height="67" rx="12" fill="#253345" stroke="#efb44b" stroke-opacity=".6"/>
    <text x="64" y="234" font-size="22" fill="#56d5ed">A</text>
    <text x="108" y="234" font-size="20">海域调查／区域监测</text>
    <text x="450" y="234" font-size="22" fill="#b1dc75">B</text>
    <text x="494" y="234" font-size="20">海上风机巡检</text>
    <text x="836" y="234" font-size="22" fill="#f4c062">C</text>
    <text x="880" y="234" font-size="20">平台／海底管路巡检</text>
    <text x="600" y="307" text-anchor="middle" font-size="20" fill="#d1e5ed">任务输入 → 联合方案 → 协同执行 → 结果接收 → 驻留／返航</text>
    <text x="600" y="340" text-anchor="middle" font-size="14" fill="#7ba3b2">任务规划 · 资源调度 · 路径自主规划 · 编队与跨介质控制</text>
  </g>
</svg>
